<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Single Paper</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Clean Tabletop Desk Surface Canvas (Zero animations) -->
<canvas id="bg-canvas"></canvas>

<!-- The Interactive Single Paper Canvas -->
<canvas id="paper-canvas"></canvas>
<!-- Pointer Interaction Layer -->
<canvas id="ui-canvas"></canvas>

<!-- Top Bar -->
<header>
    <div class="logo">
        📄 Single Paper <span class="tag">v2.5</span>
    </div>

    <div class="header-btns">
        <!-- Paper Color Swatches -->
        <div class="paper-color-group" title="Choose Paper Color">
            <span class="lbl">Paper:</span>
            <button class="paper-swatch active" data-color="#ffffff" style="background:#ffffff;" title="Pure White Paper"></button>
            <button class="paper-swatch" data-color="#fdfbf7" style="background:#fdfbf7;" title="Warm Cream"></button>
            <button class="paper-swatch" data-color="#e8d5b5" style="background:#e8d5b5;" title="Craft Brown"></button>
            <button class="paper-swatch" data-color="#fce7f3" style="background:#fce7f3;" title="Pastel Pink"></button>
            <button class="paper-swatch" data-color="#e0f2fe" style="background:#e0f2fe;" title="Pastel Blue"></button>
            <button class="paper-swatch" data-color="#dcfce7" style="background:#dcfce7;" title="Soft Mint"></button>
            <button class="paper-swatch" data-color="#1e293b" style="background:#1e293b;" title="Dark Slate"></button>
            <div class="custom-paper-wrap" title="Custom Paper Color">
                <input type="color" id="custom-paper-color" value="#ffffff">
                <span style="font-size: 0.7rem;">🎨</span>
            </div>
        </div>

        <button class="hbtn" id="btn-music" title="Toggle Relaxing Music">🎵 Music</button>
        <button class="hbtn" id="btn-origami">🦢 Origami Guide</button>
        <button class="hbtn accent" id="btn-save">💾 Save Image</button>
        <button class="hbtn danger" id="btn-reset">🗑 Reset</button>
    </div>
</header>

<!-- Quick Palette Popup -->
<div id="palette"></div>

<!-- Bottom Floating Tools -->
<div id="toolbar">
    <!-- Draw Tools -->
    <button class="tbtn active" id="tool-pen" data-tip="Pen (P)">🖊</button>
    <button class="tbtn" id="tool-pencil" data-tip="Pencil (B)">✏️</button>
    <button class="tbtn" id="tool-marker" data-tip="Marker (M)">🖌</button>
    <button class="tbtn" id="tool-eraser" data-tip="Eraser (E)">🧹</button>

    <div class="tb-sep"></div>

    <!-- Color -->
    <div style="position:relative; display:flex; align-items:center; flex-shrink:0;">
        <div id="color-dot"></div>
        <div id="color-picker-wrap">
            <input type="color" id="brush-color" value="#000000">
        </div>
    </div>
    <button class="tbtn" id="btn-palette" data-tip="Color Palette">🎨</button>

    <!-- Size Slider -->
    <div id="size-wrap">
        <input type="range" id="brush-size" min="1" max="40" value="5" title="Brush Size">
    </div>

    <div class="tb-sep"></div>

    <!-- Paper Interactions -->
    <button class="tbtn action-btn" id="tool-tear" data-tip="Tear Paper (T)">✂️</button>
    <button class="tbtn action-btn" id="btn-crush" data-tip="Crush Paper (C)">👊</button>
    <button class="tbtn action-btn" id="btn-flip" data-tip="Flip Paper (F)">🔄</button>
    <button class="tbtn" id="tool-pan" data-tip="Move Paper (H)">🖐</button>

    <div class="tb-sep"></div>

    <!-- History -->
    <button class="tbtn" id="btn-undo" data-tip="Undo (Ctrl+Z)">↩️</button>
    <button class="tbtn" id="btn-redo" data-tip="Redo (Ctrl+Y)">↪️</button>
</div>

<!-- Origami Side Panel -->
<div id="origami-panel">
    <h2>🦢 Origami Studio</h2>
    <p style="font-size:0.8rem;color:var(--muted);margin-bottom:1rem;">Choose a model to fold step-by-step</p>
    <div id="ori-list"></div>
</div>

<!-- Origami Step Tutorial Overlay -->
<div id="tut-overlay">
    <div id="tut-box">
        <button id="tut-close">✕</button>
        <div id="tut-title"></div>
        <div id="tut-progress"></div>
        <div id="tut-canvas-wrap"><canvas id="tut-canvas"></canvas></div>
        <div id="tut-instruction"></div>
        <div class="tut-btns">
            <button class="tut-btn secondary" id="tut-prev">← Previous</button>
            <button class="tut-btn primary"  id="tut-next">Next Step →</button>
        </div>
    </div>
</div>

<!-- Toast Feedback -->
<div id="toast"></div>

<!-- ES Module Entry Point -->
<script type="module" src="js/main.js"></script>

<!-- Service Worker Registration for PWA -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW error:', err));
        });
    }
</script>
</body>
</html>
