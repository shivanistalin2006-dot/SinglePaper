<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Single Paper</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-workspace: #21252f;
            --surface: rgba(255,255,255,0.08);
            --surface-hover: rgba(255,255,255,0.14);
            --border: rgba(255,255,255,0.12);
            --text: #ffffff;
            --muted: #9ba1b0;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent2: #f59e0b;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-workspace);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        /* ─── CANVASES ─── */
        #bg-canvas, #paper-canvas, #ui-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #bg-canvas    { z-index: 0; }
        #paper-canvas { z-index: 1; }
        #ui-canvas    { z-index: 2; cursor: crosshair; }

        /* ─── HEADER ─── */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.65rem 1.25rem;
            background: rgba(24, 27, 36, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.3px;
        }
        .logo span.tag {
            background: var(--accent);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .header-btns {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .hbtn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 0.45rem 0.85rem;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .hbtn:hover { background: var(--surface-hover); }
        .hbtn.danger { color: #fca5a5; }
        .hbtn.danger:hover { background: rgba(239, 68, 68, 0.2); }
        .hbtn.accent { background: var(--accent); border-color: var(--accent); }
        .hbtn.accent:hover { background: var(--accent-hover); }

        /* ─── FLOATING BOTTOM TOOLBAR ─── */
        #toolbar {
            position: fixed;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(24, 27, 36, 0.94);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 0.45rem 0.75rem;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
            max-width: calc(100vw - 1.5rem);
            overflow-x: auto;
        }
        #toolbar::-webkit-scrollbar { display: none; }

        .tbtn {
            background: transparent;
            border: none;
            color: var(--muted);
            width: 42px; height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            position: relative;
        }
        .tbtn:hover { background: var(--surface); color: var(--text); }
        .tbtn.active { background: var(--accent); color: #fff; transform: scale(1.06); }
        .tbtn.action-btn { color: var(--accent2); }
        .tbtn.action-btn:hover { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .tb-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 0.15rem;
            flex-shrink: 0;
        }

        /* Color Picker Wrapper */
        #color-picker-wrap {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }
        #color-picker-wrap input {
            opacity: 0;
            width: 200%;
            height: 200%;
            cursor: pointer;
            margin: -50%;
        }
        #color-dot {
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: #000000;
            border: 2px solid rgba(255,255,255,0.6);
            pointer-events: none;
        }

        /* Size Slider */
        #size-wrap {
            display: flex;
            align-items: center;
            padding: 0 0.35rem;
            flex-shrink: 0;
        }
        #brush-size {
            -webkit-appearance: none;
            width: 65px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.2);
            outline: none;
            cursor: pointer;
        }
        #brush-size::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(99,102,241,0.8);
        }

        /* ─── TOOLTIP ─── */
        .tbtn[data-tip]::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 17, 23, 0.95);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 500;
            white-space: nowrap;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .tbtn[data-tip]:hover::after { opacity: 1; }

        /* ─── COLOR PALETTE POPUP ─── */
        #palette {
            position: fixed;
            bottom: 5.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: none;
            gap: 0.45rem;
            background: rgba(24, 27, 36, 0.96);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0.65rem 0.85rem;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            max-width: min(340px, calc(100vw - 2rem));
            flex-wrap: wrap;
            justify-content: center;
        }
        #palette.open { display: flex; }
        .pal-color {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .pal-color:hover { transform: scale(1.2); }

        /* ─── ORIGAMI DRAWER ─── */
        #origami-panel {
            position: fixed;
            right: -340px;
            top: 54px;
            bottom: 0;
            width: 320px;
            z-index: 100;
            background: rgba(24, 27, 36, 0.96);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            padding: 1.2rem;
            overflow-y: auto;
            transition: right 0.3s ease;
        }
        #origami-panel.open { right: 0; }
        #origami-panel h2 { font-size: 1.15rem; margin-bottom: 0.25rem; }
        .ori-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.85rem 1rem;
            margin-bottom: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ori-card:hover { background: var(--surface-hover); transform: translateY(-2px); border-color: var(--accent); }
        .ori-card h3 { font-size: 0.95rem; margin-bottom: 0.2rem; }
        .ori-card p  { font-size: 0.78rem; color: var(--muted); }
        .ori-card .badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            margin-bottom: 0.4rem;
        }
        .badge.easy   { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge.medium { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge.hard   { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        /* ─── ORIGAMI TUTORIAL MODAL ─── */
        #tut-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        #tut-overlay.open { display: flex; }
        #tut-box {
            background: #1e222d;
            border: 1px solid var(--border);
            border-radius: 20px;
            width: min(500px, 94vw);
            padding: 1.8rem;
            box-shadow: var(--shadow);
            position: relative;
        }
        #tut-close {
            position: absolute;
            top: 1rem; right: 1rem;
            background: var(--surface);
            border: none;
            color: var(--text);
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #tut-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
        #tut-progress { font-size: 0.8rem; color: var(--accent2); margin-bottom: 1rem; font-weight: 600; }
        #tut-canvas-wrap {
            width: 100%;
            aspect-ratio: 4/3;
            background: #ffffff;
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }
        #tut-canvas { width: 100%; height: 100%; display: block; }
        #tut-instruction {
            font-size: 0.92rem;
            line-height: 1.5;
            color: #f1f5f9;
            min-height: 44px;
            margin-bottom: 1.2rem;
        }
        .tut-btns {
            display: flex;
            gap: 0.75rem;
        }
        .tut-btn {
            flex: 1;
            padding: 0.65rem;
            border: none;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .tut-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .tut-btn.primary { background: var(--accent); color: #fff; }
        .tut-btn.secondary { background: var(--surface-hover); color: var(--text); }

        /* ─── TOAST NOTIFICATION ─── */
        #toast {
            position: fixed;
            bottom: 5.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(15, 17, 23, 0.96);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 0.45rem 1.1rem;
            font-size: 0.82rem;
            font-weight: 500;
            z-index: 500;
            opacity: 0;
            transition: all 0.25s ease;
            pointer-events: none;
            box-shadow: var(--shadow);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            #toolbar { padding: 0.35rem 0.5rem; gap: 0.2rem; bottom: 0.8rem; }
            .tbtn { width: 38px; height: 38px; font-size: 0.95rem; }
            #brush-size { width: 45px; }
        }
    </style>
</head>
<body>

<!-- Background Desk Surface Canvas -->
<canvas id="bg-canvas"></canvas>

<!-- The Interactive Single Paper Canvas -->
<canvas id="paper-canvas"></canvas>
<!-- Pointer Interaction Layer -->
<canvas id="ui-canvas"></canvas>

<!-- Top Bar -->
<header>
    <div class="logo">
        📄 Single Paper <span class="tag">Interactive</span>
    </div>
    <div class="header-btns">
        <button class="hbtn" id="btn-origami">🦢 Origami Guide</button>
        <button class="hbtn accent" id="btn-save">💾 Save Image</button>
        <button class="hbtn danger" id="btn-reset">🗑 Reset</button>
    </div>
</header>

<!-- Quick Palette Popup -->
<div id="palette"></div>

<!-- Bottom Floating Tools -->
<div id="toolbar">
    <!-- Draw Tools -->
    <button class="tbtn active" id="tool-pen" data-tip="Pen (P)">🖊</button>
    <button class="tbtn" id="tool-pencil" data-tip="Pencil (B)">✏️</button>
    <button class="tbtn" id="tool-marker" data-tip="Marker (M)">🖌</button>
    <button class="tbtn" id="tool-eraser" data-tip="Eraser (E)">🧹</button>

    <div class="tb-sep"></div>

    <!-- Color -->
    <div style="position:relative; display:flex; align-items:center; flex-shrink:0;">
        <div id="color-dot"></div>
        <div id="color-picker-wrap">
            <input type="color" id="brush-color" value="#000000">
        </div>
    </div>
    <button class="tbtn" id="btn-palette" data-tip="Color Palette">🎨</button>

    <!-- Size Slider -->
    <div id="size-wrap">
        <input type="range" id="brush-size" min="1" max="40" value="5" title="Brush Size">
    </div>

    <div class="tb-sep"></div>

    <!-- Paper Interactions -->
    <button class="tbtn action-btn" id="tool-tear" data-tip="Tear Paper (T)">✂️</button>
    <button class="tbtn action-btn" id="btn-crush" data-tip="Crush Paper (C)">👊</button>
    <button class="tbtn action-btn" id="btn-flip" data-tip="Flip Paper (F)">🔄</button>
    <button class="tbtn" id="tool-pan" data-tip="Move Paper (H)">🖐</button>

    <div class="tb-sep"></div>

    <!-- History -->
    <button class="tbtn" id="btn-undo" data-tip="Undo (Ctrl+Z)">↩️</button>
    <button class="tbtn" id="btn-redo" data-tip="Redo (Ctrl+Y)">↪️</button>
</div>

<!-- Origami Side Panel -->
<div id="origami-panel">
    <h2>🦢 Origami Studio</h2>
    <p style="font-size:0.8rem;color:var(--muted);margin-bottom:1rem;">Choose a model to fold step-by-step</p>
    <div id="ori-list"></div>
</div>

<!-- Origami Step Tutorial Overlay -->
<div id="tut-overlay">
    <div id="tut-box">
        <button id="tut-close">✕</button>
        <div id="tut-title"></div>
        <div id="tut-progress"></div>
        <div id="tut-canvas-wrap"><canvas id="tut-canvas"></canvas></div>
        <div id="tut-instruction"></div>
        <div class="tut-btns">
            <button class="tut-btn secondary" id="tut-prev">← Previous</button>
            <button class="tut-btn primary"  id="tut-next">Next Step →</button>
        </div>
    </div>
</div>

<!-- Toast Feedback -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  SINGLE PAPER — Clean, Robust, High-Performance Canvas
// ═══════════════════════════════════════════════════════════

const bgCanvas    = document.getElementById('bg-canvas');
const paperCanvas = document.getElementById('paper-canvas');
const uiCanvas    = document.getElementById('ui-canvas');

const bgCtx    = bgCanvas.getContext('2d');
const paperCtx = paperCanvas.getContext('2d');
const uiCtx    = uiCanvas.getContext('2d');

// Standard A4 Paper Proportion (Crisp standard dimensions)
const PAPER_W = 620;
const PAPER_H = 877;

// Offscreen buffer for all drawing strokes
const drawCanvas = document.createElement('canvas');
drawCanvas.width  = PAPER_W;
drawCanvas.height = PAPER_H;
const drawCtx = drawCanvas.getContext('2d');

// Offscreen buffer for torn holes (starts completely EMPTY / transparent)
const tearCanvas = document.createElement('canvas');
tearCanvas.width  = PAPER_W;
tearCanvas.height = PAPER_H;
const tearCtx = tearCanvas.getContext('2d');

// ─── STATE ───────────────────────────────────────────────
const state = {
    // Physical transform
    tx: 0,
    ty: 0,
    scale: 1,
    rot: 0,
    flipped: false,

    // Active tool (Default to 'pen' so user can draw immediately!)
    tool: 'pen',
    color: '#000000',
    size: 5,

    // Paper physics & surface
    crushLevel: 0,
    paperColor: '#ffffff',

    // Interaction flags
    isInteracting: false,
    panStart: null,
    pinching: false,
    pinchDist: 0,
    pinchScale0: 1,
    pinchTx0: 0,
    pinchTy0: 0,
    pinchMidX: 0,
    pinchMidY: 0,
};

const foldLines = [];

// ─── RESIZE & CENTERING ───────────────────────────────────
function centerPaper() {
    const availW = window.innerWidth * 0.82;
    const availH = (window.innerHeight - 130) * 0.88;
    state.scale = Math.min(availW / PAPER_W, availH / PAPER_H, 1.1);
    state.tx = (window.innerWidth - (PAPER_W * state.scale)) / 2;
    state.ty = (window.innerHeight - (PAPER_H * state.scale)) / 2 + 10;
    state.rot = 0;
}

function resize() {
    [bgCanvas, paperCanvas, uiCanvas].forEach(c => {
        c.width  = window.innerWidth;
        c.height = window.innerHeight;
    });
    renderBg();
    renderPaper();
}
window.addEventListener('resize', () => {
    centerPaper();
    resize();
});

// ─── BACKGROUND DESK RENDERING (Clean Matte Surface) ──────
function renderBg() {
    const W = bgCanvas.width;
    const H = bgCanvas.height;
    bgCtx.clearRect(0, 0, W, H);

    // Warm, modern desk gradient
    const grad = bgCtx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, Math.max(W, H) * 0.8);
    grad.addColorStop(0, '#2d3342');
    grad.addColorStop(1, '#181b24');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, W, H);

    // Subtle workspace grid pattern
    bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
    bgCtx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < W; x += gridSize) {
        bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, H); bgCtx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(W, y); bgCtx.stroke();
    }
}

// ─── PAPER RENDERING (Crisp White Paper + Realistic Physics) 
function renderPaper() {
    const W = paperCanvas.width;
    const H = paperCanvas.height;
    paperCtx.clearRect(0, 0, W, H);

    paperCtx.save();

    // 1. Position and Scale Paper
    paperCtx.translate(state.tx, state.ty);
    paperCtx.scale(state.scale, state.scale);

    // 2. Rotate & Flip around Paper Center
    const cx = PAPER_W / 2;
    const cy = PAPER_H / 2;
    paperCtx.translate(cx, cy);
    paperCtx.rotate(state.rot);
    if (state.flipped) paperCtx.scale(-1, 1);
    paperCtx.translate(-cx, -cy);

    // 3. Drop Shadow for Physical Sheet Depth
    paperCtx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    paperCtx.shadowBlur  = 35;
    paperCtx.shadowOffsetX = 6;
    paperCtx.shadowOffsetY = 14;

    // 4. Fill Pure Base Paper
    paperCtx.fillStyle = state.paperColor;
    paperCtx.fillRect(0, 0, PAPER_W, PAPER_H);

    // Reset shadow so it doesn't affect drawing layers
    paperCtx.shadowColor = 'transparent';
    paperCtx.shadowBlur  = 0;
    paperCtx.shadowOffsetX = 0;
    paperCtx.shadowOffsetY = 0;

    // 5. Subtle Ruled / Texture Margin
    paperCtx.save();
    paperCtx.strokeStyle = 'rgba(0, 0, 0, 0.035)';
    paperCtx.lineWidth = 1;
    for (let y = 40; y < PAPER_H - 20; y += 32) {
        paperCtx.beginPath();
        paperCtx.moveTo(25, y);
        paperCtx.lineTo(PAPER_W - 25, y);
        paperCtx.stroke();
    }
    paperCtx.restore();

    // 6. Draw User Artwork Layer
    paperCtx.drawImage(drawCanvas, 0, 0);

    // 7. Crush / Crease Simulation
    if (state.crushLevel > 0) {
        drawCrushCreases(paperCtx);
    }

    // 8. Fold Lines (From Origami)
    drawFoldLines(paperCtx);

    // 9. Tear Punch-Out (Erases torn parts so desk shows through)
    paperCtx.globalCompositeOperation = 'destination-out';
    paperCtx.drawImage(tearCanvas, 0, 0);
    paperCtx.globalCompositeOperation = 'source-over';

    // 10. Outer Crisp Paper Border
    paperCtx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
    paperCtx.lineWidth = 1;
    paperCtx.strokeRect(0, 0, PAPER_W, PAPER_H);

    paperCtx.restore();
}

function drawCrushCreases(ctx) {
    ctx.save();
    ctx.globalAlpha = state.crushLevel * 0.14;
    for (let i = 0; i < state.crushLevel * 20; i++) {
        const x = Math.sin(i * 123.4 + state.crushLevel) * (PAPER_W * 0.45) + (PAPER_W / 2);
        const y = Math.cos(i * 91.2  + state.crushLevel) * (PAPER_H * 0.45) + (PAPER_H / 2);
        const len = 35 + Math.random() * 70;
        const ang = Math.random() * Math.PI * 2;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 0.8 + Math.random() * 1.2;
        ctx.stroke();
    }
    ctx.restore();
}

function drawFoldLines(ctx) {
    if (!foldLines.length) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 5]);
    foldLines.forEach(f => {
        ctx.beginPath();
        ctx.moveTo(f.x1, f.y1);
        ctx.lineTo(f.x2, f.y2);
        ctx.stroke();
    });
    ctx.restore();
}

// ─── COORDINATE CONVERSION ────────────────────────────────
function screenToPaper(sx, sy) {
    // 1. Subtract translation & unscale
    let x = (sx - state.tx) / state.scale;
    let y = (sy - state.ty) / state.scale;

    // 2. Rotate & flip around paper center
    const cx = PAPER_W / 2;
    const cy = PAPER_H / 2;
    x -= cx;
    y -= cy;

    if (state.flipped) x = -x;

    const cos = Math.cos(-state.rot);
    const sin = Math.sin(-state.rot);
    const rx = x * cos - y * sin;
    const ry = x * sin + y * cos;

    return { x: rx + cx, y: ry + cy };
}

function isInsidePaper(x, y) {
    return x >= 0 && x <= PAPER_W && y >= 0 && y <= PAPER_H;
}

// ─── AUDIO SYNTHESIS (Clean Real-time Paper Sounds) ───────
let audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playCrushSound() {
    const ac = getAudio(); if (!ac) return;
    const buf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < data.length; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        data[i] = last * 4;
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1100;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.8, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + 0.5);
    src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    src.start();
}

let tearSoundNode = null;
let tearGainNode  = null;
function startTearSound() {
    const ac = getAudio(); if (!ac || tearSoundNode) return;
    const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    tearSoundNode = ac.createBufferSource();
    tearSoundNode.buffer = buf;
    tearSoundNode.loop = true;
    const filter = ac.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 2800;
    tearGainNode = ac.createGain();
    tearGainNode.gain.setValueAtTime(0, ac.currentTime);
    tearGainNode.gain.linearRampToValueAtTime(0.35, ac.currentTime + 0.05);
    tearSoundNode.connect(filter); filter.connect(tearGainNode); tearGainNode.connect(ac.destination);
    tearSoundNode.start();
}
function stopTearSound() {
    if (!tearSoundNode) return;
    try { tearGainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08); } catch(e) {}
    const node = tearSoundNode; tearSoundNode = null;
    setTimeout(() => { try { node.stop(); } catch(e) {} }, 100);
}

// ─── UNDO / REDO ──────────────────────────────────────────
const undoStack = [];
const redoStack = [];
function saveSnapshot() {
    undoStack.push(drawCanvas.toDataURL());
    if (undoStack.length > 25) undoStack.shift();
    redoStack.length = 0;
}
function undo() {
    if (!undoStack.length) return;
    redoStack.push(drawCanvas.toDataURL());
    const img = new Image();
    img.onload = () => {
        drawCtx.clearRect(0, 0, PAPER_W, PAPER_H);
        drawCtx.drawImage(img, 0, 0);
        renderPaper();
    };
    img.src = undoStack.pop();
    toast('Undo ↩️');
}
function redo() {
    if (!redoStack.length) return;
    undoStack.push(drawCanvas.toDataURL());
    const img = new Image();
    img.onload = () => {
        drawCtx.clearRect(0, 0, PAPER_W, PAPER_H);
        drawCtx.drawImage(img, 0, 0);
        renderPaper();
    };
    img.src = redoStack.pop();
    toast('Redo ↪️');
}

// ─── DRAWING ENGINE ───────────────────────────────────────
let isStroking = false;

function applyBrush() {
    drawCtx.globalCompositeOperation = 'source-over';
    drawCtx.strokeStyle = state.color;
    drawCtx.fillStyle   = state.color;
    drawCtx.lineWidth   = state.size;
    drawCtx.lineCap     = 'round';
    drawCtx.lineJoin    = 'round';

    if (state.tool === 'pencil') {
        drawCtx.globalAlpha = 0.6;
        drawCtx.lineWidth   = Math.max(1, state.size * 0.75);
    } else if (state.tool === 'marker') {
        drawCtx.globalAlpha = 0.4;
        drawCtx.lineWidth   = state.size * 2.8;
    } else {
        drawCtx.globalAlpha = 1;
    }
}

function startStroke(sx, sy) {
    const pt = screenToPaper(sx, sy);
    if (!isInsidePaper(pt.x, pt.y)) return;

    saveSnapshot();
    isStroking = true;

    if (state.tool === 'eraser') {
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.beginPath();
        drawCtx.arc(pt.x, pt.y, state.size * 2.5, 0, Math.PI * 2);
        drawCtx.fill();
    } else {
        applyBrush();
        drawCtx.beginPath();
        drawCtx.moveTo(pt.x, pt.y);
        drawCtx.lineTo(pt.x + 0.1, pt.y + 0.1);
        drawCtx.stroke();
    }
    renderPaper();
}

function moveStroke(sx, sy) {
    if (!isStroking) return;
    const pt = screenToPaper(sx, sy);

    if (state.tool === 'eraser') {
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.beginPath();
        drawCtx.arc(pt.x, pt.y, state.size * 2.5, 0, Math.PI * 2);
        drawCtx.fill();
    } else {
        drawCtx.lineTo(pt.x, pt.y);
        drawCtx.stroke();
    }
    renderPaper();
}

function endStroke() {
    isStroking = false;
}

// ─── TEARING ENGINE ───────────────────────────────────────
let isTearing = false;
let lastTearPt = null;

function startTear(sx, sy) {
    const pt = screenToPaper(sx, sy);
    if (!isInsidePaper(pt.x, pt.y)) return;

    isTearing = true;
    lastTearPt = pt;
    tearCtx.fillStyle = '#000000';
    tearCtx.strokeStyle = '#000000';
    tearCtx.lineWidth = 18;
    tearCtx.lineCap = 'round';
    tearCtx.beginPath();
    tearCtx.moveTo(pt.x, pt.y);
    startTearSound();
}

function moveTear(sx, sy) {
    if (!isTearing || !lastTearPt) return;
    const pt = screenToPaper(sx, sy);

    const nx = pt.x + (Math.random() - 0.5) * 12;
    const ny = pt.y + (Math.random() - 0.5) * 12;

    tearCtx.lineTo(nx, ny);
    tearCtx.stroke();
    lastTearPt = pt;
    renderPaper();
}

function endTear() {
    if (!isTearing) return;
    isTearing = false;
    lastTearPt = null;
    stopTearSound();
    renderPaper();
    toast('Paper torn! ✂️');
}

// ─── POINTER & GESTURE HANDLERS ───────────────────────────
const activePointers = new Map();

uiCanvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    uiCanvas.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    // 2-Finger Pinch Zoom / Pan
    if (activePointers.size === 2) {
        endStroke();
        endTear();
        const pts = [...activePointers.values()];
        state.pinchDist   = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        state.pinchMidX   = (pts[0].x + pts[1].x) / 2;
        state.pinchMidY   = (pts[0].y + pts[1].y) / 2;
        state.pinchScale0 = state.scale;
        state.pinchTx0    = state.tx;
        state.pinchTy0    = state.ty;
        state.pinching    = true;
        return;
    }

    if (state.tool === 'pan') {
        state.panStart = { sx: e.clientX, sy: e.clientY, tx: state.tx, ty: state.ty };
    } else if (state.tool === 'tear') {
        startTear(e.clientX, e.clientY);
    } else if (['pen', 'pencil', 'marker', 'eraser'].includes(state.tool)) {
        startStroke(e.clientX, e.clientY);
    }
}, { passive: false });

uiCanvas.addEventListener('pointermove', e => {
    e.preventDefault();
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    // Handle Pinch Zoom
    if (state.pinching && activePointers.size === 2) {
        const pts = [...activePointers.values()];
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const midX = (pts[0].x + pts[1].x) / 2;
        const midY = (pts[0].y + pts[1].y) / 2;
        const ratio = dist / (state.pinchDist || 1);
        const newScale = Math.max(0.25, Math.min(3.5, state.pinchScale0 * ratio));

        state.tx = midX - (state.pinchMidX - state.pinchTx0) * ratio - (PAPER_W * newScale) / 2 + (PAPER_W * state.pinchScale0) / 2;
        state.ty = midY - (state.pinchMidY - state.pinchTy0) * ratio - (PAPER_H * newScale) / 2 + (PAPER_H * state.pinchScale0) / 2;
        state.scale = newScale;
        renderPaper();
        return;
    }

    if (state.tool === 'pan' && state.panStart) {
        state.tx = state.panStart.tx + (e.clientX - state.panStart.sx);
        state.ty = state.panStart.ty + (e.clientY - state.panStart.sy);
        renderPaper();
    } else if (state.tool === 'tear') {
        moveTear(e.clientX, e.clientY);
    } else if (['pen', 'pencil', 'marker', 'eraser'].includes(state.tool)) {
        moveStroke(e.clientX, e.clientY);
    }
}, { passive: false });

const handlePointerUp = e => {
    e.preventDefault();
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2) state.pinching = false;
    if (activePointers.size === 0) {
        state.panStart = null;
        endStroke();
        endTear();
    }
};

uiCanvas.addEventListener('pointerup',     handlePointerUp, { passive: false });
uiCanvas.addEventListener('pointercancel', handlePointerUp, { passive: false });

// Mouse Wheel Zoom
uiCanvas.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = -e.deltaY * 0.001;
    const newScale = Math.max(0.25, Math.min(3.5, state.scale * Math.exp(delta)));
    const ratio = newScale / state.scale;
    state.tx = e.clientX - (e.clientX - state.tx) * ratio;
    state.ty = e.clientY - (e.clientY - state.ty) * ratio;
    state.scale = newScale;
    renderPaper();
}, { passive: false });

// Drawing helpers for Origami visualizer
function drawPaperBox(c,x,y,w,h) {
    if (w === undefined) { c.fillStyle='#f1f5f9'; c.fillRect(0,0,x,y); return; }
    c.fillStyle='#f8fafc'; c.strokeStyle='#94a3b8'; c.lineWidth=1;
    c.fillRect(x,y,w,h); c.strokeRect(x,y,w,h);
}
function line(c,x1,y1,x2,y2,col,lw,dash) {
    c.save(); c.strokeStyle=col; c.lineWidth=lw;
    if(dash) c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.restore();
}
function tri(c,x1,y1,x2,y2,x3,y3,col) {
    c.fillStyle=col+'44'; c.strokeStyle=col; c.lineWidth=2;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.lineTo(x3,y3); c.closePath();
    c.fill(); c.stroke();
}
function diamond(c,w,h,col) {
    c.fillStyle=col+'44'; c.strokeStyle=col; c.lineWidth=2;
    c.beginPath(); c.moveTo(w/2,h*.08); c.lineTo(w*.9,h/2); c.lineTo(w/2,h*.92); c.lineTo(w*.1,h/2); c.closePath();
    c.fill(); c.stroke();
}
function heart(c,w,h,col) {
    c.fillStyle=col; c.beginPath(); c.moveTo(w/2,h*.7);
    c.bezierCurveTo(w*.1,h*.5,w*.1,h*.2,w/2,h*.35);
    c.bezierCurveTo(w*.9,h*.2,w*.9,h*.5,w/2,h*.7);
    c.closePath(); c.fill();
}
function drawCraneOutline(c,w,h) {
    c.fillStyle='rgba(99,102,241,0.2)'; c.strokeStyle='#6366f1'; c.lineWidth=2.5;
    c.beginPath(); c.moveTo(0,-h*.35); c.lineTo(-w*.3,0); c.lineTo(0,h*.35); c.lineTo(w*.3,0); c.closePath();
    c.fill(); c.stroke();
}
function drawBoatOutline(c,w,h) {
    c.fillStyle='rgba(56,189,248,0.25)'; c.strokeStyle='#0284c7'; c.lineWidth=2.5;
    c.beginPath(); c.moveTo(-w*.4,h*.1); c.lineTo(-w*.35,h*.25); c.lineTo(w*.35,h*.25); c.lineTo(w*.4,h*.1); c.closePath();
    c.fill(); c.stroke();
    tri(c,-w*.1,-h*.3,w*.1,-h*.3,0,h*.1,'#0284c7');
}
function drawPlaneOutline(c,w,h) {
    c.fillStyle='rgba(245,158,11,0.25)'; c.strokeStyle='#f59e0b'; c.lineWidth=2.5;
    c.beginPath(); c.moveTo(-w*.45,h*.05); c.lineTo(w*.45,0); c.lineTo(-w*.45,-h*.05); c.closePath();
    c.fill(); c.stroke();
}
function drawFoxOutline(c,w,h) {
    c.fillStyle='rgba(249,115,22,0.3)'; c.strokeStyle='#f97316'; c.lineWidth=2.5;
    c.beginPath();
    c.moveTo(0,-h*.1); c.lineTo(-w*.3,-h*.3); c.lineTo(-w*.15,h*.2); c.lineTo(w*.15,h*.2); c.lineTo(w*.3,-h*.3); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle='#000'; c.beginPath(); c.arc(0,h*.12,4,0,Math.PI*2); c.fill();
}

// ─── ORIGAMI SIDEBAR & MODAL ──────────────────────────────
const oriList = document.getElementById('ori-list');
ORIGAMI.forEach((model, idx) => {
    const card = document.createElement('div');
    card.className = 'ori-card';
    card.innerHTML = `<div class="badge ${model.level}">${model.level.toUpperCase()}</div><h3>${model.name}</h3><p>${model.steps.length} folding steps</p>`;
    card.addEventListener('click', () => openTutorial(idx));
    oriList.appendChild(card);
});

document.getElementById('btn-origami').addEventListener('click', () => {
    document.getElementById('origami-panel').classList.toggle('open');
});

let tutModel = null;
let tutStep  = 0;
const tutCanvas = document.getElementById('tut-canvas');
const tutCtx    = tutCanvas.getContext('2d');

function openTutorial(idx) {
    tutModel = ORIGAMI[idx];
    tutStep  = 0;
    document.getElementById('origami-panel').classList.remove('open');
    document.getElementById('tut-overlay').classList.add('open');
    renderTutStep();
}

function renderTutStep() {
    if (!tutModel) return;
    const step = tutModel.steps[tutStep];
    const total = tutModel.steps.length;

    document.getElementById('tut-title').textContent = tutModel.name;
    document.getElementById('tut-progress').textContent = `STEP ${tutStep + 1} OF ${total}`;
    document.getElementById('tut-instruction').textContent = step.text;
    document.getElementById('tut-prev').disabled = (tutStep === 0);
    document.getElementById('tut-next').textContent = (tutStep === total - 1) ? '🎉 Complete Fold' : 'Next Step →';

    const wrap = document.getElementById('tut-canvas-wrap');
    tutCanvas.width  = wrap.clientWidth  || 420;
    tutCanvas.height = wrap.clientHeight || 300;
    const w = tutCanvas.width;
    const h = tutCanvas.height;

    tutCtx.clearRect(0, 0, w, h);
    tutCtx.fillStyle = '#f8fafc';
    tutCtx.fillRect(0, 0, w, h);
    step.draw(tutCtx, w, h);

    // Add visual fold line to physical paper
    if (tutStep > 0) {
        const hw = PAPER_W / 2;
        const hh = PAPER_H / 2;
        const a  = (tutStep / total) * Math.PI;
        foldLines.push({
            x1: hw + Math.cos(a) * hw * 0.9,
            y1: hh + Math.sin(a) * hh * 0.9,
            x2: hw - Math.cos(a) * hw * 0.9,
            y2: hh - Math.sin(a) * hh * 0.9
        });
        renderPaper();
    }
}

document.getElementById('tut-next').addEventListener('click', () => {
    if (!tutModel) return;
    if (tutStep < tutModel.steps.length - 1) {
        tutStep++;
        renderTutStep();
    } else {
        document.getElementById('tut-overlay').classList.remove('open');
        toast('Origami folding complete! 🦢🎉');
        tutModel = null;
    }
});
document.getElementById('tut-prev').addEventListener('click', () => {
    if (tutStep > 0) {
        tutStep--;
        foldLines.pop();
        renderTutStep();
        renderPaper();
    }
});
document.getElementById('tut-close').addEventListener('click', () => {
    document.getElementById('tut-overlay').classList.remove('open');
    tutModel = null;
});

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────
window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
        return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        redo();
        return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        document.getElementById('btn-save').click();
        return;
    }

    const k = e.key.toLowerCase();
    if (k === 'p') selectTool('pen', 'tool-pen');
    else if (k === 'b') selectTool('pencil', 'tool-pencil');
    else if (k === 'm') selectTool('marker', 'tool-marker');
    else if (k === 'e') selectTool('eraser', 'tool-eraser');
    else if (k === 't') selectTool('tear', 'tool-tear');
    else if (k === 'h' || k === 'v' || k === ' ') selectTool('pan', 'tool-pan');
    else if (k === 'c') document.getElementById('btn-crush').click();
    else if (k === 'f') document.getElementById('btn-flip').click();
});

// ─── TOAST NOTIFICATION ───────────────────────────────────
let toastTimer = null;
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── INITIALIZATION ───────────────────────────────────────
updateColorDot();
centerPaper();
resize();
selectTool('pen', 'tool-pen');

// Register Service Worker for offline PWA
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW error:', err));
    });
}
</script>
